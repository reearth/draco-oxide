[package]
name = "draco-oxide-core"
description = "Shared core for draco-oxide: the geometry/attribute data model, numeric primitives, and the compression algorithms shared between the encoder and decoder."
authors = ["Re:Earth Contributors"]
edition = "2021"
rust-version = "1.84"
version = "0.1.0-alpha.5"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/reearth/draco-oxide"
repository = "https://github.com/reearth/draco-oxide"

[dependencies]
draco-nd-vector = { path = "../macros/draco-nd-vector", version = "0.0.0" }
remain = "0.2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
paste = "1.0"
seq-macro = "0.3.6"
kiddo = "5.2.4"

[dev-dependencies]
faer = "0.22.6"
