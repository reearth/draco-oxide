[package]
name = "draco-oxide-core"
description = "Shared core for draco-oxide: the geometry/attribute data model, numeric primitives, and the compression algorithms shared between the encoder and decoder."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
draco-nd-vector.workspace = true
remain = "0.2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
paste = "1.0"
seq-macro = "0.3.6"
kiddo = "5.2.4"
# Enabled only by the `test-util` feature (for the Laplacian connectivity check).
faer = { version = "0.22.6", optional = true }

[dev-dependencies]
faer = "0.22.6"

[features]
default = ["safety_assertions"]
# Exposes cross-crate test utilities (`codec::connectivity::eq`), used by the
# decoder round-trip tests in the `draco-oxide` crate. Not part of any shipping
# build; pulls in `faer` for the Laplacian spectrum comparison.
test-util = ["dep:faer"]
# Gates the `debug_write!` / `debug_expect!` macros (defined in `utils/debug`).
# Resolved at each macro call site, so every crate that invokes them must
# declare this feature; the `draco-oxide` encoder forwards into it.
debug_format = []
# Gates the `safety_assert!` / `safety_assert_eq!` checks. On by default and
# combined with `debug_assertions` (the macros use `all(...)`), so the checks run
# in debug builds only and never in release. Disable with `--no-default-features`
# to drop them from debug builds too. A failing safety assertion is always a bug,
# never a runtime check. Resolved at each macro call site, so every crate that
# invokes the macros declares it and forwards into core.
safety_assertions = []
