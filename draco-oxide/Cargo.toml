[package]
description = "draco-oxide is a rust rewrite of Google's draco mesh compression library."
name = "draco-oxide"
authors.workspace = true
edition.workspace = true
exclude = ["benches/", "test-data/", "testdata/"]
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"

[dependencies]
draco-oxide-core.workspace = true
draco-oxide-decoder = { workspace = true, optional = true }
enum_dispatch = "0.3.13"
remain = "0.2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tobj = "4.0.3"
gltf = { version = "1.4", features = ["extensions", "guess_mime_type", "image", "import"] }
image = { version = "0.25", features = ["webp"] }

[features]
default = ["decoder", "safety_assertions"]
# Re-exports the decoder crate as `draco_oxide::decode`. Disable with
# `--no-default-features` for an encoder-only build.
decoder = ["dep:draco-oxide-decoder"]
evaluation = []
# Forwards into core so debug output is enabled across every crate, not just here.
debug_format = ["draco-oxide-core/debug_format", "draco-oxide-decoder?/debug_format"]
# Gates the safety-assertion checks. On by default and combined with
# `debug_assertions`, so the checks run in debug builds only and never in release;
# a failing assertion is always a bug, never a runtime check. Disable with
# `--no-default-features` to drop them from debug builds too. Forwarded into core
# and the decoder so their checks fire too.
safety_assertions = [
    "draco-oxide-core/safety_assertions",
    "draco-oxide-decoder?/safety_assertions",
]