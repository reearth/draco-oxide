[package]
description = "draco-oxide is a rust rewrite of Google's draco mesh compression library."
name = "draco-oxide"
authors.workspace = true
edition.workspace = true
exclude = ["benches/", "test-data/", "testdata/"]
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../README.md"

[dependencies]
draco-oxide-core.workspace = true
draco-oxide-decoder = { workspace = true, optional = true }
enum_dispatch = "0.3.13"
remain = "0.2.15"
serde_json = "1.0"
thiserror = "2.0.12"
tobj = "4.0.3"
gltf = { version = "1.4", features = ["extensions", "guess_mime_type", "image", "import"] }
image = { version = "0.25", features = ["webp"] }

[features]
default = ["decoder"]
decoder = ["dep:draco-oxide-decoder"]
evaluation = []
# Forwards into core (always) and the decoder (only when the `decoder` feature
# pulls it in) so debug output is enabled across every crate, not just here.
debug_format = ["draco-oxide-core/debug_format", "draco-oxide-decoder?/debug_format"]