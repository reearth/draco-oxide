[package]
description = "draco-oxide is a rust rewrite of Google's draco mesh compression library."
name = "draco-oxide"
authors = ["Re:Earth Contributors"]
edition = "2021"
exclude = ["benches/", "test-data/", "testdata/"]
rust-version = "1.84"
version = "0.1.0-alpha.5"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/reearth/draco-oxide"
repository = "https://github.com/reearth/draco-oxide"
readme = "../README.md"

[dependencies]
draco-oxide-core = { path = "core", version = "0.1.0-alpha.5" }
draco-oxide-decoder = { path = "decoder", version = "0.1.0-alpha.5", optional = true }
enum_dispatch = "0.3.13"
remain = "0.2.15"
serde_json = "1.0"
thiserror = "2.0.12"
tobj = "4.0.3"
gltf = { version = "1.4", features = ["extensions", "guess_mime_type", "image", "import"] }
image = { version = "0.25", features = ["webp"] }

[features]
default = ["decoder"]
decoder = ["dep:draco-oxide-decoder"]
evaluation = []
debug_format = []