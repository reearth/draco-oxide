[package]
name = "draco-oxide-decoder"
description = "Decoder for draco-oxide (work in progress): decompresses draco-encoded geometry into the draco-oxide-core mesh model."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
draco-oxide-core.workspace = true
thiserror = "2.0.12"
remain = "0.2.15"
enum_dispatch = "0.3.13"

[dev-dependencies]
# Encoder, used only by the entropy unit tests to round-trip
# encode_symbols -> decode_symbols. No dependency cycle: the draco-oxide
# crate does not depend on this decoder crate.
draco-oxide = { path = "..", default-features = false }

[features]
default = ["safety_assertions"]
# Enables debug output from the core macros used in `decode/`. Forwarded to
# core because the `#[cfg(feature = "debug_format")]` in those macros resolves
# in this crate, not in core.
debug_format = ["draco-oxide-core/debug_format"]
# Gates the safety-assertion checks. On by default and combined with
# `debug_assertions`, so the checks run in debug builds only and never in release;
# a failing assertion is always a bug, never a runtime check. Disable with
# `--no-default-features` to drop them from debug builds too. Forwarded to core for
# the same call-site resolution reason as `debug_format`.
safety_assertions = ["draco-oxide-core/safety_assertions"]
