[package]
name = "draco-oxide-decoder"
description = "Decoder for draco-oxide: decompresses draco-encoded triangular meshes into the draco-oxide-core mesh model."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
draco-oxide-core.workspace = true
thiserror = "2.0.12"
remain = "0.2.15"

[features]
default = ["dequantize", "safety_assertions", "rare-component-types"]
# Decoding of attributes declared with the rarely used component types i8,
# i16, and i32 (u8, u16, u32, and f32 are always supported; 64-bit types are
# always rejected as unimplemented). On by default; a build without it rejects
# streams declaring these types and drops their narrowing instantiations from
# the module.
rare-component-types = []
# Decoding of point-cloud streams (kd-tree method) via `decode_point_cloud()`
# and the `Geometry::PointCloud` variant. Off by default: it costs about 23 KB
# of linked WASM, which a mesh-only viewer should not pay. The `draco-oxide`
# crate turns it on.
point-cloud = []
# Phase-3 reconstruction: dequantize integer attributes to their original format
# and octahedral values to unit normals, exposing the full `decode()` entry point.
# Disable with `--no-default-features` for the portable/GPU tier, where only
# `decode_portable()` (integer attributes + dequantization params) is compiled.
dequantize = []
# Enables debug output from the core macros used in this crate. Forwarded to
# core because the `#[cfg(feature = "debug_format")]` in those macros resolves
# in this crate, not in core.
debug_format = ["draco-oxide-core/debug_format"]
# Gates the safety-assertion checks. On by default and combined with
# `debug_assertions`, so the checks run in debug builds only and never in release;
# a failing assertion is always a bug, never a runtime check. Disable with
# `--no-default-features` to drop them from debug builds too. Forwarded to core for
# the same call-site resolution reason as `debug_format`.
safety_assertions = ["draco-oxide-core/safety_assertions"]
