# Dependency policy for `cargo deny check`. CI runs it with `--all-features
# --locked`, so the audited set is the maximal feature closure of the
# committed `Cargo.lock`.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained upstream. Direct dependency of draco-oxide-core
    # with one call site; `pastey` is a drop-in replacement.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
# Permissive licenses only; every entry is matched by a crate in the lockfile.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    # rav1e's `fuzzing` feature pulls libfuzzer-sys, which is partly NCSA.
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The unpublished members (cli, tests, bench, wasm-size-probe, wasi-codec)
# carry no license field and are all `publish = false`.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
