[package]
name = "tests"
version = "0.0.0"
edition = "2021"
publish = false
description = "Internal integration tests for draco-oxide. Keeping the codegen build.rs and test harness here means the published `draco-oxide` crate ships without a build script."

[dependencies]
draco-oxide = { path = "../draco-oxide" }
draco-oxide-decoder = { path = "../draco-oxide/decoder", features = ["gltf"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tobj = "4.0.3"
gltf = { version = "1.4", features = ["import"] }
parry3d = "0.28"
# Rendering + SSIM for the camera/visual `Ssim` comparison method. `image` is
# pinned to the same 0.25 the encoder crate uses, and `image-compare` (MIT)
# depends on `image ^0.25`, so there's no duplicate-version churn.
image = "0.25"
image-compare = "0.5"

[dev-dependencies]
# Used by tests/eval/mod.rs (behind the `evaluation` feature) to serialize
# EvalWriter output.
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native Google Draco C++ binding used by google_compat.rs to cross-check our
# decoder output against the reference decoder. Builds the bundled C++ library
# via cxx-build, so adds a few seconds to the first `cargo test` run.
draco_decoder = "0.0.26"

[features]
# Forwarded so `cargo test -p tests --features evaluation` enables draco-oxide's
# evaluation APIs used by tests/eval/mod.rs.
evaluation = ["draco-oxide/evaluation"]
