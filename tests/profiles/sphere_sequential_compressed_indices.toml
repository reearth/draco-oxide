# Sequential connectivity with the face indices entropy-coded as deltas rather
# than stored verbatim.
#
# Google's encoder only takes this path behind an option its CLI does not
# expose, so decoding our own output through `draco_decoder` is what pins the
# delta reconstruction to the reference.

[[operations]]
op = "DracoOxideEncode"
input = "sphere.obj"
output = "oxide.drc"
cfg = { connectivity = "Sequential", sequential = { indices = "Compressed" } }

[[operations]]
op = "DracoDecode"
input = "oxide.drc"
output = "google.obj"

[[operations]]
op = "DracoOxideDecode"
input = "oxide.drc"
output = "oxide.obj"

[[operations]]
op = "Comparison"
input1 = "google.obj"
input2 = "oxide.obj"
methods = [
    { method = "L2Norm", max = 0.000001 },
    { method = "Ssim", min = 0.9999, color_by = "Geometry" },
]
