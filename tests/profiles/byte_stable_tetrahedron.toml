# Byte-stability gate: locks the default-config encoded stream for tetrahedron.obj
# byte-for-byte. The encoder's output is consumed by Google's Draco decoder in
# the field, so any change here is a bitstream change and must be intentional;
# rebaseline with DUMP_ENCODE_FINGERPRINTS=1 after verifying interop.

[[operations]]
op = "DracoOxideEncode"
input = "tetrahedron.obj"
output = "oxide.drc"

[[operations]]
op = "Fingerprint"
input = "oxide.drc"
len = 1087
fnv1a = "0x5d1b21a340ff95a7"
