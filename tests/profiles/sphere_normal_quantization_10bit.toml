# Octahedral normals at a quantization other than the 8-bit default.
#
# The lattice size reaches the prediction, the portabilization and the
# prediction transform, which all have to agree on it and on the value written
# into the transform metadata.

[[operations]]
op = "DracoOxideEncode"
input = "sphere.obj"
output = "oxide.drc"
cfg = { attributes = { Normal = { quantization = { bits = 10 } } } }

[[operations]]
op = "DracoDecode"
input = "oxide.drc"
output = "google.obj"

[[operations]]
op = "DracoOxideDecode"
input = "oxide.drc"
output = "oxide.obj"

[[operations]]
op = "Comparison"
input1 = "google.obj"
input2 = "oxide.obj"
methods = [
    { method = "L2Norm", max = 0.000001 },
    { method = "Ssim", min = 0.9999, color_by = "Normal" },
]
