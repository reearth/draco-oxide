# Encodes positions with constrained multi-parallelogram prediction.
#
# The encoder selects a parallelogram subset per vertex against the running
# residual entropy and records the choice as crease bits; the stream must be
# decodable by the reference decoder, and both decoders must reconstruct the
# same geometry. The comparison against the source mesh is bounded by the
# quantization error, the cross-decoder comparison by parity alone.

[[operations]]
op = "DracoOxideEncode"
input = "sphere.obj"
output = "oxide.drc"
[operations.cfg.attributes.Position]
prediction = "MeshConstrainedMultiParallelogramPrediction"
quantization = { bits = 14 }

[[operations]]
op = "DracoDecode"
input = "oxide.drc"
output = "google_decoded.obj"

[[operations]]
op = "DracoOxideDecode"
input = "oxide.drc"
output = "oxide_decoded.obj"

[[operations]]
op = "Comparison"
input1 = "sphere.obj"
input2 = "google_decoded.obj"
methods = [{ method = "L2Norm", max = 0.001 }]

[[operations]]
op = "Comparison"
input1 = "google_decoded.obj"
input2 = "oxide_decoded.obj"
methods = [{ method = "L2Norm", max = 0.00001 }]
