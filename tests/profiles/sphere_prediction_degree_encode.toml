# Encodes positions over the prediction-degree traversal.
#
# The traversal reorders the value stream to maximize the parallelograms
# available at each prediction, pairing naturally with constrained
# multi-parallelogram prediction; this is the reference encoder's level 10
# configuration. The stream must be decodable by the reference decoder, and
# both decoders must reconstruct the same geometry.

[[operations]]
op = "DracoOxideEncode"
input = "sphere.obj"
output = "oxide.drc"
[operations.cfg.attributes.Position]
prediction = "MeshConstrainedMultiParallelogramPrediction"
traversal = "PredictionDegree"
quantization = { bits = 14 }

[[operations]]
op = "DracoDecode"
input = "oxide.drc"
output = "google_decoded.obj"

[[operations]]
op = "DracoOxideDecode"
input = "oxide.drc"
output = "oxide_decoded.obj"

[[operations]]
op = "Comparison"
input1 = "sphere.obj"
input2 = "google_decoded.obj"
methods = [{ method = "L2Norm", max = 0.001 }]

[[operations]]
op = "Comparison"
input1 = "google_decoded.obj"
input2 = "oxide_decoded.obj"
methods = [{ method = "L2Norm", max = 0.00001 }]
