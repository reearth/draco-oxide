name: release

# Publishes the four public crates to crates.io when a version tag is pushed.
# Cut tags from a green commit; this workflow verifies packaging but does not
# rerun the full test suite (tests.yml covers every push).
#
# Requires the CARGO_REGISTRY_TOKEN repository secret (a crates.io API token
# with publish scope for all four crates).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "draco-oxide") | .version')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version $version" >&2
            exit 1
          fi

      # Dependency order: macro -> core -> decoder -> encoder. `cargo publish`
      # blocks until each crate is available in the index, so the next publish
      # can resolve it. Already-published versions are skipped, so a partially
      # failed release can be rerun from the same tag.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "draco-oxide") | .version')
          for crate in draco-nd-vector draco-oxide-core draco-oxide-decoder draco-oxide; do
            prefix=$(echo "$crate" | cut -c1-2)/$(echo "$crate" | cut -c3-4)
            if curl -sf "https://index.crates.io/$prefix/$crate" | grep -q "\"vers\":\"$version\""; then
              echo "$crate $version already published, skipping"
              continue
            fi
            cargo publish -p "$crate" --locked
          done
