name: draco-roundtrip

# Encode test meshes with draco-oxide and confirm Google Draco's reference
# decoder accepts the output without crashing.
on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cmake, gcc/g++, ninja and git are preinstalled on ubuntu-latest, so no
      # apt step is needed to build Google Draco.

      # Cache the built Google Draco tree, keyed on the pinned tag and the build
      # script. On a hit, build-draco.sh sees the binary and is a no-op.
      - name: Cache Google Draco
        uses: actions/cache@v4
        with:
          path: third_party/draco
          key: draco-${{ runner.os }}-1.5.7-${{ hashFiles('scripts/build-draco.sh') }}

      - name: Build Google Draco reference decoder
        run: ./scripts/build-draco.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # rust-toolchain.toml pins the version, which cargo auto-installs.
      # Runs the draco_decode smoke test plus every TOML profile under
      # tests/profiles/ that build.rs codegen turns into a test.
      - name: draco-oxide tests (smoke + profiles)
        run: cargo test --package tests -- --nocapture
