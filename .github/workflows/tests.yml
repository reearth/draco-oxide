name: tests

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache the built Google Draco tree.
      - name: Cache Google Draco
        uses: actions/cache@v4
        with:
          path: third_party/draco
          key: draco-${{ runner.os }}-1.5.7-${{ hashFiles('scripts/build-draco.sh') }}

      - name: Build Google Draco reference decoder
        run: ./scripts/build-draco.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: workspace tests
        run: cargo test --workspace -- --nocapture
