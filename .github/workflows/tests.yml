name: tests

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all --check

  warnings:
    runs-on: ubuntu-latest
    # Deny compiler warnings (rustc only; clippy lints run in the `clippy` job).
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Mirror the `tests` job scope: the draco-oxide crates + integration
      # `tests` crate, excluding the cli/analyzer apps. `--all-targets` also
      # covers test/example/bench code; the second pass adds the `evaluation`
      # feature so its `#[cfg(...)]` code is checked too.
      - name: check (default features)
        run: cargo check --workspace --exclude cli --exclude analyzer --all-targets

      - name: check (evaluation feature)
        run: cargo check -p draco-oxide --features evaluation --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Same scope and two-pass structure as the `warnings` job. `-D warnings`
      # is passed to clippy-driver so any clippy lint fails the build.
      - name: clippy (default features)
        run: cargo clippy --workspace --exclude cli --exclude analyzer --all-targets -- -D warnings

      - name: clippy (evaluation feature)
        run: cargo clippy -p draco-oxide --features evaluation --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The decoder is the WASM/embedded unit; every feature tier must stay
      # green on wasm32. The size probe builds the linked cdylib per tier and
      # prints the module sizes for the job log.
      - name: decoder on wasm32 (default tier)
        run: cargo build -p draco-oxide-decoder --target wasm32-unknown-unknown --release

      - name: decoder on wasm32 (portable tier)
        run: cargo build -p draco-oxide-decoder --target wasm32-unknown-unknown --release --no-default-features

      - name: size probe (full)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-full.wasm

      - name: size probe (portable)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown --no-default-features
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-portable.wasm

      - name: report module sizes
        run: |
          gzip -k -9 probe-full.wasm probe-portable.wasm
          ls -la probe-*.wasm probe-*.wasm.gz

  tests:
    runs-on: ubuntu-latest
    env:
      DRACO_TAG: "1.5.7"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4

      # Cache the built Google Draco tree.
      - name: Cache Google Draco
        uses: actions/cache@v4
        with:
          path: third_party/draco
          key: draco-${{ runner.os }}-${{ env.DRACO_TAG }}-${{ hashFiles('scripts/build-draco.sh') }}

      - name: Build Google Draco reference decoder
        run: ./scripts/build-draco.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Test the draco-oxide crates (draco-oxide, -core, -decoder, draco-nd-vector)
      # and the integration `tests` crate. The cli/analyzer apps are excluded.
      - name: tests
        run: cargo test --workspace --exclude cli --exclude analyzer -- --nocapture

      # The above run never enables `evaluation`, so the encoder's
      # `#[cfg(feature = "evaluation")]` tests are compiled out. Cover them
      # explicitly rather than relying on analyzer's feature unification.
      - name: evaluation tests
        run: cargo test -p draco-oxide --features evaluation -- --nocapture
