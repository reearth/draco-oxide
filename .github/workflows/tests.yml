name: tests

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: rustfmt
        run: cargo fmt --all --check

  warnings:
    runs-on: ubuntu-latest
    # Deny compiler warnings (rustc only; clippy lints run in the `clippy` job).
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Mirror the `tests` job scope: the draco-oxide crates + integration
      # `tests` crate, excluding the cli app. `--all-targets` also
      # covers test/example/bench code.
      - name: check (default features)
        run: cargo check --workspace --exclude cli --all-targets

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Same scope and two-pass structure as the `warnings` job. `-D warnings`
      # is passed to clippy-driver so any clippy lint fails the build.
      - name: clippy (default features)
        run: cargo clippy --workspace --exclude cli --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The decoder is the WASM/embedded unit; every feature tier must stay
      # green on wasm32. The size probe builds the linked cdylib per tier and
      # prints the module sizes for the job log.
      - name: decoder on wasm32 (default tier)
        run: cargo build -p draco-oxide-decoder --target wasm32-unknown-unknown --release

      - name: decoder on wasm32 (portable tier)
        run: cargo build -p draco-oxide-decoder --target wasm32-unknown-unknown --release --no-default-features

      - name: decoder on wasm32 (point-cloud tier)
        run: cargo build -p draco-oxide-decoder --target wasm32-unknown-unknown --release --features point-cloud

      - name: decoder on wasm32 (portable + point-cloud tier)
        run: cargo build -p draco-oxide-decoder --target wasm32-unknown-unknown --release --no-default-features --features point-cloud

      - name: size probe (full)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-full.wasm

      - name: size probe (portable)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown --no-default-features
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-portable.wasm

      - name: size probe (full + point cloud)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown --features point-cloud
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-point-cloud.wasm

      - name: size probe (portable + point cloud)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown --no-default-features --features point-cloud
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-portable-point-cloud.wasm

      - name: size probe (full, common component types only)
        run: |
          cargo build -p wasm-size-probe --profile wasm-size --target wasm32-unknown-unknown --no-default-features --features dequantize
          cp target/wasm32-unknown-unknown/wasm-size/wasm_size_probe.wasm probe-common-types.wasm

      # A deployment runs binaryen over the module (Emscripten does the same
      # for the reference decoder), so the deliverable size is the
      # post-wasm-opt one; the raw cargo output is reported alongside it.
      - name: install binaryen
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar -xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"

      - name: report module sizes
        run: |
          for f in probe-*.wasm; do
            wasm-opt -Oz --strip-debug \
              --enable-bulk-memory --enable-sign-ext \
              --enable-mutable-globals --enable-nontrapping-float-to-int \
              "$f" -o "opt-$f"
          done
          gzip -k -9 probe-*.wasm opt-*.wasm
          ls -la probe-*.wasm probe-*.wasm.gz opt-*.wasm opt-*.wasm.gz

  tests:
    runs-on: ubuntu-latest
    env:
      DRACO_TAG: "1.5.7"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cache the built Google Draco tree.
      - name: Cache Google Draco
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/draco
          key: draco-${{ runner.os }}-${{ env.DRACO_TAG }}-${{ hashFiles('scripts/build-draco.sh') }}

      - name: Build Google Draco reference decoder
        run: ./scripts/build-draco.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Test the draco-oxide crates (draco-oxide, -core, -decoder, draco-nd-vector)
      # and the integration `tests` crate. The cli app is excluded.
      - name: tests
        run: cargo test --workspace --exclude cli -- --nocapture
