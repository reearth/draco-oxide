[workspace]
resolver = "3"
members = ["draco-oxide", "draco-oxide/core", "draco-oxide/decoder", "cli", "tests", "bench", "wasm-size-probe", "wasi-codec"]

# Shared metadata for the version-locked draco-oxide library crates
# (draco-oxide, draco-oxide-core, draco-oxide-decoder). Bump `version` in one
# place; the cli/tests crates keep their own versions.
[workspace.package]
version = "0.1.0-alpha.11"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Re:Earth Contributors"]
homepage = "https://github.com/reearth/draco-oxide"
repository = "https://github.com/reearth/draco-oxide"

# Internal path dependencies declared once so member versions stay in lockstep.
[workspace.dependencies]
draco-oxide-core = { path = "draco-oxide/core", version = "0.1.0-alpha.11" }
draco-oxide-decoder = { path = "draco-oxide/decoder", version = "0.1.0-alpha.11" }
draco-nd-vector = { path = "draco-oxide/macros/draco-nd-vector", version = "0.1.0-alpha.11" }

# Size-oriented profile for measuring (and shipping) the decoder's WASM
# bundle: optimize for size, single codegen unit, fat LTO, no unwinding.
[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Speed-oriented WASM profile for the wasm decode benchmark: same shape but
# optimized for speed, so measured times reflect a deployment built for speed.
[profile.wasm-speed]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"

# The test suites drive the codec and the OBJ loader (and the Laplacian
# spectrum comparison, via faer) hard enough that unoptimized dependency
# builds dominate `cargo test` wall time; each crate under test itself
# keeps its debug profile, and debug assertions stay on throughout.
[profile.dev.package.draco-oxide]
opt-level = 2

[profile.dev.package.draco-oxide-core]
opt-level = 2

[profile.dev.package.draco-oxide-decoder]
opt-level = 2

[profile.dev.package.faer]
opt-level = 2
