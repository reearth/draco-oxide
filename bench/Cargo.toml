[package]
name = "bench"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "bench"

[dependencies]
draco-oxide = { path = "../draco-oxide" }
pprof = { version = "0.13", features = ["flamegraph"], optional = true }

[features]
profiling = ["dep:pprof"]

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "profile-decode"
path = "src/bin/profile_decode.rs"
required-features = ["profiling"]

[build-dependencies]
cc = "1"
